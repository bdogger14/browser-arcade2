<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake | Browser Arcade 2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

h1 {
    color: #a78bfa;
    margin-bottom: 5px;
}

.score {
    font-size: 20px;
    margin: 15px;
}

canvas {
    width: min(90vw, 500px);
    height: min(90vw, 500px);
    background: #080d18;
    border: 3px solid #9675f7;
    border-radius: 10px;
}

button {
    background: #9675f7;
    border: none;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 15px;
    cursor: pointer;
}

p {
    color: #aab0c4;
}
</style>
</head>

<body>

<h1>🐍 SNAKE</h1>
<p>Use your arrow keys to move.</p>

<div class="score">
    Score: <span id="score">0</span>
</div>

<canvas id="game" width="500" height="500"></canvas>

<button onclick="restart()">RESTART</button>

<p>Browser Arcade 2 Original Game</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 25;
const tiles = 20;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;
let loop;

function randomFood() {
    return {
        x: Math.floor(Math.random() * tiles),
        y: Math.floor(Math.random() * tiles)
    };
}

function restart() {
    snake = [{ x: 10, y: 10 }];
    dx = 1;
    dy = 0;
    score = 0;
    gameOver = false;
    food = randomFood();

    document.getElementById("score").textContent = score;

    clearInterval(loop);
    draw();
    loop = setInterval(update, 110);
}

function update() {
    if (gameOver) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    const ateFood =
        head.x === food.x && head.y === food.y;

    const bodyToCheck = ateFood
        ? snake
        : snake.slice(0, -1);

    const hitBody = bodyToCheck.some(
        part => part.x === head.x && part.y === head.y
    );

    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tiles ||
        head.y >= tiles ||
        hitBody
    ) {
        gameOver = true;
        draw();
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 35px Arial";
        ctx.fillText("GAME OVER", 250, 250);
        return;
    }

    snake.unshift(head);

    if (ateFood) {
        score++;
        document.getElementById("score").textContent = score;
        food = randomFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = "#080d18";
    ctx.fillRect(0, 0, 500, 500);

    ctx.fillStyle = "#ff536b";
    ctx.fillRect(
        food.x * size,
        food.y * size,
        size - 2,
        size - 2
    );

    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#bca5ff" : "#8060e8";

        ctx.fillRect(
            part.x * size,
            part.y * size,
            size - 2,
            size - 2
        );
    });
}

document.addEventListener("keydown", event => {
    const keys = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
    ];

    if (keys.includes(event.key)) {
        event.preventDefault();
    }

    if (event.key === "ArrowUp" && dy !== 1) {
        dx = 0;
        dy = -1;
    }

    if (event.key === "ArrowDown" && dy !== -1) {
        dx = 0;
        dy = 1;
    }

    if (event.key === "ArrowLeft" && dx !== 1) {
        dx = -1;
        dy = 0;
    }

    if (event.key === "ArrowRight" && dx !== -1) {
        dx = 1;
        dy = 0;
    }
});

restart();
</script>

</body>
</html>
